name: Storybook viewer smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  storybook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Test legacy via normalization and real canvas textures
        run: bun test tests/legacy-via-normalization.test.ts tests/legacy-ssop-combined-textures.test.ts tests/legacy-ssop-trace-textures.test.ts
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build and smoke test real Storybook viewers
        run: bun run test:storybook-smoke
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-smoke-report
          path: |
            playwright-report/
            test-results/storybook/
          retention-days: 14
