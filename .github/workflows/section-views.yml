name: Viewer interaction browser tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  section-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install
      - name: Test visibility state and component menus
        run: bun test tests/get-hidden-scene-objects.test.ts tests/schematic-context-menu.test.tsx tests/object-visibility-scene.test.tsx tests/object-visibility-scene2.test.tsx
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:sections
      - name: Test selective component visibility
        run: bun run test:unhide-components --output=test-results/unhide-components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-interaction-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
