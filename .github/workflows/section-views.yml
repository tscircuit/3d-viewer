name: Section view browser tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  section-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:sections
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-view-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
