name: Object visibility interactions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test ./tests/hidden-cad-components.test.tsx ./tests/schematic-context-menu.test.tsx ./tests/pick-cad-component.test.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:visibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-interactions
          path: test-results/visibility/
