name: Visual snapshots

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Compare visual snapshots
        run: bun run test:visual-snapshots
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
