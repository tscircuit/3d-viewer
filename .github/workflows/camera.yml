name: Camera regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install
      - name: Camera, session, GLB and dolly regressions
        run: bun test tests/initial-model-camera-fit.test.tsx tests/get-initial-camera-position.test.ts tests/camera-presets-after-glb-fit.test.tsx tests/camera-session-lifecycle.test.tsx tests/camera-session-storage.test.ts tests/public-camera-session-storage.test.ts tests/glb-model-lifecycle.test.tsx tests/infinite-dolly.test.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:camera
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
